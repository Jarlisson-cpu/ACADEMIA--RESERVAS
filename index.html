<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar Nova Reserva - Academia Power</title>
    <link rel="stylesheet" href="form_style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <i class="fa-solid fa-dumbbell"></i>
      </div>
      <div class="header-info">
        <h1>Sistema de Reservas - Academia Power</h1>
        <p>Gerencie treinos e aulas de forma eficiente</p>
      </div>
    </header>

    <div class="form-container">
      <form class="reserva-form" id="reservation-form">
        <div class="form-group">
          <label for="nome-aluno">Nome do aluno</label>
          <input
            type="text"
            id="nome-aluno"
            placeholder="Diga o seu nome completo"
            required
          />
        </div>

        <div class="form-row">
          <div class="form-group half-width">
            <label for="cpf">CPF</label>
            <input
              type="text"
              id="cpf"
              placeholder="000.000.000-00"
              pattern="[0-9\.\-]{11,15}"
              required
            />
          </div>
          <div class="form-group half-width">
            <label for="idade">Idade</label>
            <input
              type="number"
              id="idade"
              min="1"
              max="120"
              placeholder="Ex: 30"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="plano">Plano</label>
          <select id="plano" required>
            <option value="" disabled selected>Selecione um plano</option>
            <option value="mensal">Mensal</option>
            <option value="trimestral">Trimestral</option>
            <option value="anual">Anual</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tipo-atividade">Tipo de atividade</label>
          <select id="tipo-atividade" required>
            <option value="" disabled selected>Selecione uma atividade</option>
            <option value="1">Aula de Spinning (09:00)</option>
            <option value="2">Aula de Musculação (10:00)</option>
            <option value="3">Aula de Yoga (11:00)</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group half-width">
            <label for="data">Data</label>
            <input type="date" id="data" required />
          </div>
          <div class="form-group half-width">
            <label for="horario">Horário</label>
            <input type="time" id="horario" required />
          </div>
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <input type="text" id="status" value="Reservado" disabled />
        </div>

        <div class="form-group">
          <p id="availability-status" style="font-weight: bold; color: #333">
            Selecione atividade, data e horário para verificar disponibilidade.
          </p>
        </div>

        <div class="form-buttons">
          <button type="button" class="btn-create" onclick="window.location.href='reservas.html'">Ver Reservas</button>
          <button
            type="button"
            class="btn-cancelar"
            onclick="window.location.href='index.html'"
          >
            Cancelar
          </button>
          <button type="submit" class="btn-criar">Criar Reserva</button>
        </div>
      </form>

      <div class="form-image"></div>
    </div>

    <script src="criar_reserva.js"></script>
    <div class="form-group">
    <label for="nome">Nome do Aluno</label>
    <input type="text" id="nome" placeholder="Diga o seu nome completo" required>
</div>

<div class="form-row">
    <div class="form-group half-width">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" required>
    </div>
    <div class="form-group half-width">
        <label for="idade">Idade</label>
        <input type="number" id="idade" required>
    </div>
</div>

<div class="form-group">
    <label for="plano">Plano</label>
    <select id="plano" required>
        <option value="" disabled selected>Selecione o plano</option>
        <option value="Mensal">Mensal</option>
        <option value="Trimestral">Trimestral</option>
        <option value="Anual">Anual</option>
    </select>
</div>

  </body>
</html>
